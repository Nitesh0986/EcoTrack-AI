[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-ecotrack-engine"
version = "0.1.0"
description = "Executa plugin: ecotrack-engine"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-ecotrack-engine" = "ecotrack_engine_plugin:main"

[tool.setuptools]
py-modules = ["ecotrack_engine_plugin", "ecotrack_core"]
